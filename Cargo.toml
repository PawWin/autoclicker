[package]
name = "tap-autoclicker"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
description = "A small, considered desktop autoclicker"
license = "GPL-3.0-only"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18"] }
enigo = { version = "0.6.1", features = ["wayland"] }
global-hotkey = "0.9.0"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

