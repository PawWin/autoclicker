[package]
name = "tap-autoclicker"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
description = "A small, considered desktop autoclicker"
license = "GPL-3.0-only"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18"] }
enigo = "0.6.1"
global-hotkey = "0.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
kdl = "4"
serde_json = "1.0.154"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

